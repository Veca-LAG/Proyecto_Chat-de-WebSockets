name: Check sensitive files

on:
  push:
  pull_request:

jobs:
  check-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tracked files
        run: node scripts/check-git-sensitive-files.js
